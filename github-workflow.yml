name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Create the Android project files
        run: |
          flutter create --platforms=android --org com.pesa --project-name pesa_app _gen
          rm -rf android
          cp -r _gen/android android
          rm -rf _gen
          sed -i 's/android:label="[^"]*"/android:label="Pesa"/' android/app/src/main/AndroidManifest.xml

      - name: App icon
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            (convert assets/icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png || magick assets/icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png) || true
          done

      - run: flutter pub get

      - name: Check the code (errors are listed here if the build fails)
        run: flutter analyze || true

      - name: Build the APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v6
        with:
          name: pesa-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
